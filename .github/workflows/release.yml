name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the verified wheels to PyPI (otherwise build + smoke only)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: wheel-linux-x86_64
            linux_arch: x86_64
          - os: ubuntu-24.04-arm
            artifact: wheel-linux-aarch64
            linux_arch: aarch64
          - os: windows-latest
            artifact: wheel-windows-amd64
          - os: macos-latest
            artifact: wheel-macos-universal2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os != 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      # one native build per platform; each script only produces its own binary
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1
      - if: runner.os == 'macOS'
        shell: bash
        run: sh ./scripts/build-native.sh
      - if: runner.os == 'Linux'
        shell: bash
        run: sh ./scripts/build-linux-wheel.sh ${{ matrix.linux_arch }}
      - if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install setuptools wheel && python setup.py bdist_wheel
      - if: runner.os == 'macOS'
        shell: bash
        run: python -m pip install setuptools wheel && python setup.py bdist_wheel --plat-name macosx-11.0-universal2
      - shell: bash
        run: python scripts/check_wheel.py dist/*.whl
      - shell: bash
        run: python -m pip install twine && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true
      - shell: bash
        run: "python -m pip install --only-binary=:all: --no-index --find-links wheelhouse yumeclient"
      # scripts/ is sys.path[0], so the installed wheel is imported, not the checkout
      - shell: bash
        run: python scripts/smoke_wheel.py

  # the Linux wheels claim manylinux2014 (glibc 2.17); run them on that glibc
  smoke-oldest-glibc:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true
      - shell: bash
        run: |
          docker run --rm -v "$PWD:/w" -w /w quay.io/pypa/manylinux2014_${{ matrix.arch }} bash -euc '
            ldd --version | head -1
            ran=0
            for py in cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
              [ -x /opt/python/$py/bin/python ] || continue
              /opt/python/$py/bin/python -m pip install -q --only-binary=:all: --no-index --find-links wheelhouse yumeclient
              /opt/python/$py/bin/python scripts/smoke_wheel.py
              ran=$((ran + 1))
            done
            test "$ran" -ge 1'

  publish:
    needs: [build, smoke, smoke-oldest-glibc]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/yumeclient
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
