name: test
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache-dependency-path: native/go.sum
      - name: patched upstream modules match upstream + native/third_party/patches
        run: python scripts/third_party.py check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1
      - if: runner.os != 'Windows'
        shell: bash
        run: sh ./scripts/build-native.sh
        env:
          YUMECLIENT_MAC_ARCHS: arm64
      - name: native unit tests
        shell: bash
        working-directory: native
        run: go test -count=1 ./...
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
