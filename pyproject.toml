[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yumeclient"
version = "0.2.0"
description = "Async Python facade for bogdanfinn/tls-client"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools]
packages = ["yumeclient"]
include-package-data = true

[tool.setuptools.package-data]
yumeclient = ["py.typed", "*.so", "*.dylib", "*.dll"]
